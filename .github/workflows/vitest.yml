name: Vitest

on: [push, pull_request]

jobs:
    unit-tests:
        runs-on: ubuntu-latest

        steps:
            # Checkout repository
            - uses: actions/checkout@v4

            # Setup Node.js
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            # Install dependencies, skipping optional deps to avoid Mac-specific packages
            - run: npm ci --omit=optional

            # Run unit tests
            - run: npm run test -- --run
